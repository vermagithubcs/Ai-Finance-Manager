<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body class="bg-[#E2E8F0]">
    <div class="h-screen w-screen flex items-center justify-center">
      <div class="w-[617px] h-[600px] border border-black rounded-25px">
        <div
          class="w-[616px] h-[113px] bg-[#F4F4F4] rounded-t-25px flex items-center justify-evenly flex-col"
        >
          <h1 class="text-[35px] font-semibold">Sign Up</h1>
          <p class="text-[#0179FE] text-[20px] font-medium">
            Please enter your details
          </p>
        </div>
        <div class="flex flex-col justify-evenly items-center h-[500px]">
          <form action="">
            <label for="name">Name:</label>
            <br />
            <input
              class="border relative top-2 p-2 border-black w-[466px] h-[40px]"
              type="text"
              placeholder="Enter your name" required
            />
            <br />
          </form>
          <form action="">
            <label for="name">Email:</label>
            <br />
            <input
              class="border relative top-2 border-black w-[466px] h-[40px] p-2"
              type="text"
              placeholder="Enter your email" required
            />
            <br />
          </form>
          <form action="">
            <label for="name">Password:</label>
            <br />
            <input
              class="border relative top-2 border-black w-[466px] h-[40px] p-2"
              type="text"
              placeholder="Enter Password here" required
            />
            <br />
          </form>
          <form action="">
            <label for="name">Confirm Password:</label>
            <br />
            <input
              class="border relative top-2 border-black w-[466px] h-[40px] p-2"
              type="text"
              placeholder="Confirm Password here" required
            />
          </form>
          <div>
              <button class="bg-[#0179FE] w-[466px] h-[56px] rounded-10px text-[#fff] text-[16px] font-semibold">Sign Up</button>
          </div>
          <div class="flex gap-2">
            <p>Already have an account?</p>
            <p class="cursor-pointer text-[#0065DC]">Login</p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
