<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <link rel="stylesheet" href="../dist/output.css" />
  </head>
  <body class="bg-[#E2E8F0]">
    <div class="h-screen w-screen flex items-center justify-center">
      <div
        class="login w-[620px] h-[511px] rounded-[25px] bg-[#ffffff]"
      >
        <div
          class="w-[617px] h-[113px] bg-[#F4F4F4] rounded-t-25px flex flex-col items-center justify-evenly"
        >
          <h1 class="text-[35px] font-semibold">Login</h1>
          <p class="text-[#0179FE] font-medium text-[20px]">
            Please enter details to login
          </p>
        </div>
        <div class="flex flex-col items-center justify-evenly h-[398px]">
          <form action="">
            <label for="email">Email:</label><br />
            <input
              class="w-[466px] h-[40px] relative top-2 p-2 border border-black" 
              type="email"
              placeholder="Enter email here"
              required
            />
            <br />
          </form>
          <form action="">
            <label for="password">Password:</label><br />
            <input
              class="w-[466px] h-[40px] relative top-2 p-2 border border-black"
              type="email"
              placeholder="Enter password here"
              required
            />
          </form>
          <div>
            <button
              class="w-[466px] h-[58px] bg-[#0179FE] rounded-[10px] text-[#fff] font-semibold">
              Sign Up
            </button>
          </div>
          <div class="flex gap-2">
            <p>Don't have an account?</p>
            <p class="text-[#0065DC] cursor-pointer">Sign up</p>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
